name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  e2e-smoke:
    name: E2E smoke tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The selected smoke tests intercept this endpoint; no backend credential is used in CI.
      NEXT_PUBLIC_API_BASE_URL: https://dstest.easywaka.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec playwright test
          tests/e2e/auth-smoke.spec.ts
          tests/e2e/auth-expiration.spec.ts
          tests/e2e/register-scroll.spec.ts
          tests/e2e/qr-payload.spec.ts
          --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
